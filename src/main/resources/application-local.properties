# Local development against the in-process PostgreSQL started by the "local" Maven profile.
# The datasource bean comes from EmbeddedPostgresConfiguration, so the URL and credentials
# below exist only to satisfy configuration binding.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=local-embedded
clearledger.cors.allowed-origins=http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173
