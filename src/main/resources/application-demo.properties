clearledger.demo.enabled=true
clearledger.demo.seed-history=true
clearledger.api.rate-limit-per-minute=1000
spring.jpa.show-sql=false

# The background reconciler is paused in the demo profile on purpose. Its job is to heal
# every pending payment within one interval, which would empty the exception queue seconds
# after startup and leave a visitor with nothing to look at. Paused, the queue stays open
# and the operator drives the compare-and-swap repair themselves; the console shows the
# worker's state rather than hiding it.
clearledger.reconciliation.enabled=false
