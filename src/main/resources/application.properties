spring.application.name=ClearLedger
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clearledger}
spring.datasource.username=${DATABASE_USERNAME:clearledger}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.threads.virtual.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

clearledger.demo.enabled=false
clearledger.reconciliation.enabled=true
clearledger.reconciliation.fixed-delay-ms=30000
clearledger.api.rate-limit-per-minute=300
clearledger.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.security.user.name=${API_USERNAME:clearledger-operator}
spring.security.user.roles=OPS

logging.level.root=INFO
logging.level.io.clearledger=INFO
