<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ClearLedger payment and reconciliation architecture</title>
  <desc id="desc">Browser and nginx connect to a Spring Boot payment API. The API evaluates risk and writes balanced journals to PostgreSQL. A reconciliation worker verifies pending payments and compare-and-swap finalizes status without a second journal write.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071512"/>
      <stop offset="1" stop-color="#10211d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16342c"/>
      <stop offset="1" stop-color="#102721"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#74d6b4"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, Segoe UI, sans-serif; fill: #f1fbf7; }
      .subtitle { font: 400 17px Inter, Segoe UI, sans-serif; fill: #9ebbb1; }
      .box-title { font: 700 20px Inter, Segoe UI, sans-serif; fill: #f1fbf7; }
      .box-copy { font: 400 15px Inter, Segoe UI, sans-serif; fill: #b9cec7; }
      .label { font: 700 13px Inter, Segoe UI, sans-serif; fill: #74d6b4; letter-spacing: 1.2px; }
      .step { font: 700 15px Inter, Segoe UI, sans-serif; fill: #071512; }
      .small { font: 400 13px Inter, Segoe UI, sans-serif; fill: #9ebbb1; }
      .flow { stroke: #74d6b4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .repair { stroke: #f5bf68; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <circle cx="1320" cy="70" r="210" fill="#1b5f4c" opacity=".12"/>
  <circle cx="120" cy="860" r="250" fill="#c38b3b" opacity=".08"/>

  <text x="72" y="76" class="title">ClearLedger</text>
  <text x="72" y="108" class="subtitle">Real-time payment risk, balanced ledger, and conservative reconciliation</text>

  <!-- Components are grouped and labeled so this file remains easy to edit in Figma, Illustrator, or a text editor. -->
  <g id="edge-tier" filter="url(#shadow)">
    <rect x="72" y="180" width="240" height="142" rx="20" fill="url(#panel)" stroke="#2d5b4d"/>
    <rect x="92" y="200" width="66" height="26" rx="13" fill="#74d6b4"/>
    <text x="111" y="218" class="step">01</text>
    <text x="92" y="262" class="box-title">Operations console</text>
    <text x="92" y="290" class="box-copy">React + TypeScript</text>
    <text x="92" y="312" class="small">Untrusted browser boundary</text>
  </g>

  <g id="proxy-tier" filter="url(#shadow)">
    <rect x="374" y="180" width="240" height="142" rx="20" fill="url(#panel)" stroke="#2d5b4d"/>
    <rect x="394" y="200" width="66" height="26" rx="13" fill="#74d6b4"/>
    <text x="413" y="218" class="step">02</text>
    <text x="394" y="262" class="box-title">nginx edge</text>
    <text x="394" y="290" class="box-copy">Static UI + /api proxy</text>
    <text x="394" y="312" class="small">Only published service</text>
  </g>

  <g id="api-tier" filter="url(#shadow)">
    <rect x="676" y="156" width="344" height="190" rx="22" fill="url(#panel)" stroke="#3f806c"/>
    <rect x="696" y="178" width="66" height="26" rx="13" fill="#74d6b4"/>
    <text x="715" y="196" class="step">03</text>
    <text x="696" y="240" class="box-title">Spring Boot payment API</text>
    <text x="696" y="270" class="box-copy">Validation · idempotency · state machine</text>
    <rect x="696" y="294" width="140" height="32" rx="8" fill="#21473c"/>
    <text x="714" y="315" class="label">RISK ENGINE</text>
    <rect x="850" y="294" width="146" height="32" rx="8" fill="#21473c"/>
    <text x="868" y="315" class="label">JOURNAL POST</text>
  </g>

  <g id="database-tier" filter="url(#shadow)">
    <rect x="1082" y="180" width="286" height="142" rx="20" fill="url(#panel)" stroke="#3f806c"/>
    <ellipse cx="1170" cy="214" rx="54" ry="17" fill="#74d6b4" opacity=".9"/>
    <path d="M1116 214v58c0 10 24 18 54 18s54-8 54-18v-58" fill="#21473c" stroke="#74d6b4" stroke-width="2"/>
    <path d="M1116 242c0 10 24 18 54 18s54-8 54-18" fill="none" stroke="#74d6b4" stroke-width="2"/>
    <text x="1294" y="225" class="box-title" text-anchor="middle">PostgreSQL</text>
    <text x="1225" y="312" class="small" text-anchor="middle">payments · journals · audit</text>
  </g>

  <path class="flow" d="M312 251 H363"/>
  <path class="flow" d="M614 251 H665"/>
  <path class="flow" d="M1020 251 H1071"/>

  <g id="online-path">
    <text x="72" y="410" class="label">ONLINE PAYMENT PATH</text>
    <line x1="72" y1="428" x2="1368" y2="428" stroke="#2d5b4d"/>

    <g transform="translate(76 462)">
      <circle cx="34" cy="34" r="34" fill="#74d6b4"/><text x="34" y="40" class="step" text-anchor="middle">1</text>
      <text x="82" y="28" class="box-title">Validate</text><text x="82" y="52" class="small">Boundary schema</text>
    </g>
    <g transform="translate(318 462)">
      <circle cx="34" cy="34" r="34" fill="#74d6b4"/><text x="34" y="40" class="step" text-anchor="middle">2</text>
      <text x="82" y="28" class="box-title">Deduplicate</text><text x="82" y="52" class="small">Hash + fingerprint</text>
    </g>
    <g transform="translate(608 462)">
      <circle cx="34" cy="34" r="34" fill="#74d6b4"/><text x="34" y="40" class="step" text-anchor="middle">3</text>
      <text x="82" y="28" class="box-title">Assess risk</text><text x="82" y="52" class="small">Explainable signals</text>
    </g>
    <g transform="translate(874 462)">
      <circle cx="34" cy="34" r="34" fill="#74d6b4"/><text x="34" y="40" class="step" text-anchor="middle">4</text>
      <text x="82" y="28" class="box-title">Commit journal</text><text x="82" y="52" class="small">Debit = credit</text>
    </g>
    <g transform="translate(1164 462)">
      <circle cx="34" cy="34" r="34" fill="#74d6b4"/><text x="34" y="40" class="step" text-anchor="middle">5</text>
      <text x="82" y="28" class="box-title">Finalize</text><text x="82" y="52" class="small">Explicit status</text>
    </g>
  </g>

  <g id="failure-boundary">
    <rect x="72" y="578" width="1296" height="82" rx="18" fill="#2c2417" stroke="#8d672f"/>
    <text x="98" y="610" class="label" fill="#f5bf68">SIMULATED TIMEOUT BOUNDARY</text>
    <text x="98" y="638" class="box-copy">Balanced journal commits successfully · status finalization does not complete · payment remains PENDING</text>
    <path d="M1108 548 V578" class="repair"/>
  </g>

  <g id="reconciliation-tier" filter="url(#shadow)">
    <rect x="72" y="708" width="1296" height="132" rx="22" fill="url(#panel)" stroke="#8d672f"/>
    <text x="98" y="744" class="label" fill="#f5bf68">RECONCILIATION WORKER</text>
    <text x="98" y="780" class="box-title">Scan pending state</text>
    <text x="338" y="780" class="box-title">Verify existing journal</text>
    <text x="638" y="780" class="box-title">Plan from durable facts</text>
    <text x="964" y="780" class="box-title">CAS-finalize status</text>
    <text x="98" y="810" class="small">Pending rows · write lock</text>
    <text x="338" y="810" class="small">Balance · currency · ownership</text>
    <text x="638" y="810" class="small">Repair or flag; never repost</text>
    <text x="964" y="810" class="small">Expected version · audit event</text>
    <path class="repair" d="M278 778 H322"/>
    <path class="repair" d="M576 778 H622"/>
    <path class="repair" d="M906 778 H948"/>
    <path class="repair" d="M1260 708 C1260 676 1250 670 1224 660"/>
  </g>

  <text x="1368" y="876" class="small" text-anchor="end">Editable SVG · ClearLedger architecture</text>
</svg>
